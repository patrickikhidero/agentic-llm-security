- id: ops_incident_postmortem
  source: "corp/docs/ops/incident_postmortem_0417.pdf"
  topic: operations
  urgency: high
  content: >
    Incident Postmortem: API Gateway Latency Spike. A misconfigured retry
    policy caused a 4x amplification in downstream request volume during
    a partial outage. Root cause was a missing circuit breaker. Action
    item: add circuit breakers to all retry-enabled service clients before
    end of quarter, owned by the platform team.

