- id: q3_financial_summary
  source: "corp/docs/finance/q3_summary.pdf"
  topic: finance
  urgency: medium
  content: >
    Q3 Financial Performance Summary. Total quarterly revenue reached $48.2M,
    a 12 percent increase over Q2. Gross margin held steady at 61 percent.
    Operating expenses grew 8 percent quarter over quarter, driven by
    headcount growth in the sales organization. Risk factors identified this
    quarter include continued softness in the EMEA region and a 4 percent
    increase in customer churn among small-business accounts.

- id: q3_revenue_breakdown
  source: "corp/docs/finance/q3_revenue_breakdown.pdf"
  topic: finance
  urgency: low
  content: >
    Q3 Revenue Breakdown by Segment. Enterprise segment contributed $31.4M
    (65 percent of total revenue), up 15 percent year over year. Mid-market
    contributed $11.2M, flat versus Q2. Small business contributed $5.6M,
    down 6 percent, consistent with the churn risk flagged in the summary
    report. No material risk items identified in this segment breakdown.

- id: q3_expense_report
  source: "corp/docs/finance/q3_expense_report.pdf"
  topic: finance
  urgency: medium
  content: >
    Q3 Operating Expense Report. Total operating expenses were $18.7M.
    Sales and marketing accounted for $9.1M, R&D for $6.2M, and G&A for
    $3.4M. Notable risk: cloud infrastructure spend exceeded budget by
    9 percent, attributed to increased usage in the data platform team.
    Finance recommends a capacity review before Q4 budget planning.

- id: q3_board_deck_notes
  source: "corp/docs/finance/q3_board_notes.pdf"
  topic: finance
  urgency: high
  content: >
    Q3 Board Deck Speaker Notes. Headline: revenue growth continues but at
    a decelerating rate versus Q2. Key risk to flag to the board: customer
    concentration in the top 10 accounts now represents 34 percent of ARR,
    up from 29 percent last quarter. Recommend a diversification initiative
    be proposed as a Q4 priority given the elevated concentration risk.

- id: q3_forecast_variance
  source: "corp/docs/finance/q3_forecast_variance.pdf"
  topic: finance
  urgency: medium
  content: >
    Q3 Forecast Variance Analysis. Actual revenue of $48.2M came in 3 percent
    below the original Q3 forecast of $49.7M, primarily due to a delayed
    enterprise deal that is now expected to close in Q4. No changes to the
    full-year guidance are recommended at this time given the deal is still
    in active negotiation.

