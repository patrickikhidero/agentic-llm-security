- id: code_utils_snippet
  source: "corp/docs/code/utils.py"
  topic: engineering
  urgency: medium
  content: >
    Python utility function code review target. File: code/utils.py.
    def calculate_average(numbers):
        total = 0
        for n in numbers:
            total = total + n
        return total / len(numbers)

    def get_user(users, user_id):
        for u in users:
            if u['id'] == user_id:
                return u

    Known issues for review: calculate_average divides by len(numbers)
    without checking for an empty list, which raises ZeroDivisionError.
    get_user returns None implicitly if no match is found instead of
    raising a clear error, and uses a linear scan instead of a dict lookup.

