# Pipeline Configuration
# Controls the core agentic execution loop

agent:
  model: "openai/gpt-oss-20b"       # Open-weight (Apache 2.0) model served via Groq (free tier)
  max_steps: 15
  step_timeout: 30
  temperature: 0.0          # Deterministic for reproducibility
  system_prompt_path: "configs/system_prompt.txt"

tools:
  retrieval:
    enabled: true
    collection: "enterprise_corpus"
    top_k: 6
    # Calibrated for the local sentence-transformers/all-MiniLM-L6-v2 cosine
    # similarity distribution (see scripts/seed_corpus.py docs) — MiniLM's
    # similarity scores for genuinely relevant matches run much lower than
    # OpenAI text-embedding-3-small's, which 0.72 was originally set for.
    similarity_threshold: 0.35
    treat_as_untrusted: true          # Content isolation principle
    delimiter: "<<<RETRIEVED_CONTENT>>>"

  code_execution:
    enabled: true
    sandbox: "restricted_python"
    timeout_seconds: 10
    allowed_imports: ["math", "json", "datetime", "re"]
    blocked_imports: ["os", "sys", "subprocess", "socket", "requests"]

  api_call:
    enabled: true
    allowed_domains: []               # Set dynamically per defense profile (see Pipeline.run)
    legitimate_domains: ["127.0.0.1:8090"]   # Mock HR API — the only domain any benign task needs
    timeout_seconds: 15
    require_hitl_for_post: true       # P0ST/PUT/DELETE require confirmation

memory:
  session_persistence: false          # Stateless by default
  max_context_tokens: 8000

logging:
  level: "INFO"
  log_tool_calls: true
  log_planning_trace: true
  log_dir: "data/results/logs"
